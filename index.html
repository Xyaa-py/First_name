
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flappy Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🐦 Flappy Pro</h1>
            <p>Fly as far as you can.</p>
        </header>


        <!-- GAME + SETTINGS -->
        <div class="game-layout">

            <!-- SETTINGS -->
            <div class="settings">

                <h2>Settings</h2>

                <label>
                    Upload Background
                    <input
                        type="file"
                        id="backgroundUpload"
                        accept="image/*"
                    >
                </label>

                <div class="divider"></div>

                <button id="dayTheme">
                    ☀ Day
                </button>

                <button id="sunsetTheme">
                    🌅 Sunset
                </button>

                <button id="nightTheme">
                    🌙 Night
                </button>

            </div>


            <!-- GAME -->
            <div class="game-box">

                <canvas
                    id="gameCanvas"
                    width="480"
                    height="700">
                </canvas>


                <div id="menu">

                    <h2>Ready?</h2>

                    <button id="playBtn">
                        Play
                    </button>

                </div>


                <div id="gameOver">

                    <h2>Game Over</h2>

                    <p id="scoreText"></p>

                    <button id="restartBtn">
                        Play Again
                    </button>

                </div>

            </div>

        </div>


        <footer>
            Made with ❤️ by Niraj
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
